<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TalkShow — POP TV — Titre Indépendant</title>
    <link rel="stylesheet" href="assets/talkshow.css">
    <link rel="stylesheet" href="assets/v1_warm.css">
</head>
<body>
    <div class="canvas">
        <div class="ts-titleband" style="opacity:0;">
            <div class="ts-titleband-top">
                <div class="ts-titleband-main" lang="ar">العنوان الرئيسي</div>
            </div>
            
            <div class="ts-titleband-separator"></div>
            
            <div class="ts-titleband-bottom">
                <div class="ts-titleband-sub" lang="ar">النص الثانوي</div>
            </div>
        </div>
    </div>
    
    <script>
    (function () {
        'use strict';
        var started = false;
        var band = document.querySelector(".ts-titleband");

        function play() {
            if (started || !band) return;
            started = true;
            
            var cs = getComputedStyle(document.documentElement);

            /*
             * Timeline propre à Titre 1.
             * Ne pas utiliser les variables globales --ts-in-dur / --ts-out-dur /
             * --ts-hold / --ts-out-to : elles appartiennent au Master Invite 10 s.
             */
            var inDur = parseFloat(cs.getPropertyValue("--ts-title1-in-dur")) || 400;
            var holdMs = parseFloat(cs.getPropertyValue("--ts-title1-hold")) || 4080;
            var outDur = parseFloat(cs.getPropertyValue("--ts-title1-out-dur")) || 400;
            var outTo = (cs.getPropertyValue("--ts-title1-out-to") || "").trim() || "translateY(50px)";

            /* Pré-roll 80 ms réellement transparent. */
            band.style.opacity = "0";
            band.style.transform = outTo;
            
                        var total = inDur + holdMs + outDur;

            /*
             * IMPORTANT :
             * easing global LINEAR = timings exacts.
             * 0-80 ms      : transparent
             * 80-480 ms    : entrée
             * 480-4560 ms  : maintien
             * 4560-4960 ms : sortie
             * 4960-5000 ms : transparent
             */
            var kf = [
                { opacity: 0, transform: outTo, offset: 0,
                  easing: "cubic-bezier(0.22, 0.8, 0.24, 1)" },
                { opacity: 1, transform: "translateY(0)", offset: inDur / total,
                  easing: "linear" },
                { opacity: 1, transform: "translateY(0)", offset: (inDur + holdMs) / total,
                  easing: "cubic-bezier(0.4, 0, 0.6, 1)" },
                { opacity: 0, transform: outTo, offset: 1 }
            ];

            band.animate(kf, {
                delay: 80,
                duration: total,
                easing: "linear",
                fill: "both"
            });
        }

        function arm() {
            if (!document.body || !band) return;
            if (document.body.classList.contains("playing")) { play(); }
            var obs = new MutationObserver(function () {
                if (started) { obs.disconnect(); return; }
                if (document.body.classList.contains("playing")) {
                    obs.disconnect();
                    play();
                }
            });
            obs.observe(document.body, { attributes: true, attributeFilter: ["class"] });
        }
        arm();
    })();
    </script>
    <script src="assets/habillage.js"></script>
</body>
</html>
